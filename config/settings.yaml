# Settings for Food Price Watch: A Monitoring and Abnormal-Rise Alert System for Daily Retail Food Prices in Dhaka.
# Plan: docs/PROJECT_PLAN_2026-11-17.md. Changes to items, dates, drivers or rules go into DEVIATIONS.md first.

drive:
  data_root: /content/drive/MyDrive/FoodPriceWatch_v2          # this project's data and outputs (Colab)
  old_raw: /content/drive/MyDrive/FoodPriceWatch/data/raw/project   # where notebook 01 copies the raw files from
  old_processed: /content/drive/MyDrive/FoodPriceWatch/data/processed   # old panel and features, for the regression check only

raw_files:
  prices: tcb_dhaka_daily_prices_2021_2026.csv                  # TCB Dhaka daily retail prices, 2021-05-17 to 2026-10-24
  ramadan_eid: bd_ramadan_eid.csv
  fx: yahoo_bdt_per_usd.csv                                     # taka per US dollar; stale from about Sep 2026 (DEVIATIONS.md)
  weather: weather_open_meteo_13_locations_2019_2026.csv

# The 8 focus items (chosen 2026-11-16 for how often their prices move and for being everyday purchases; chosen after
# earlier results were seen). group = the item group of the earlier run, for reporting only (not in the data file).
# weather / fx = whether the driver is a model input for the item; for other items those columns are empty.
items:
  - {id: "Chicken - Broiler | per kg",      group: volatile_perishable, weather: false, fx: false}
  - {id: "Onion - Local | per kg",          group: volatile_perishable, weather: true,  fx: false}
  - {id: "Egg - Farm | per hali (4 pcs)",   group: volatile_perishable, weather: false, fx: false}
  - {id: "Potato | per kg",                 group: domestic_staple,     weather: true,  fx: false}
  - {id: "Soybean Oil - Loose | per litre", group: administered,        weather: false, fx: true}
  - {id: "Palm Oil - Loose | per litre",    group: administered,        weather: false, fx: true}
  - {id: "Garlic - Imported | per kg",      group: imported_staple,     weather: false, fx: true}
  - {id: "Sugar | per kg",                  group: administered,        weather: false, fx: true}

gap_2022: ["2022-03-12", "2022-12-31"]    # TCB reported only sporadically; never filled across, never scored

periods:
  validation: ["2024-01-01", "2024-12-31"]   # every choice (model, level, threshold) is made here
  test: ["2025-01-01", "2026-10-24"]         # already looked at by the earlier run, so results are labelled retrospective

drivers:
  # weather columns (fixed in src/foodwatch/features.py): wx_tmax_7d, wx_tmean_30d, wx_rain_7d, Bangladesh mean of locations 0-10;
  # chosen on 2024 by the earlier run
  weather_lag_days: 5        # weather of day d is usable from d + 5
  carry_cap_days: 7          # a driver value older than this on a report day is left empty

# Sustained-rise reference: what alerts are scored against (notebook 05). Same rule as the earlier run (S34), not re-chosen.
rises:
  window_reports: 14         # R = P_t / P_(t-14 report days) - 1
  threshold: 0.10            # a rise day has R >= 10 %
  persist_reports: 5         # an episode is at least 5 consecutive rise days
  merge_gap_reports: 14      # episodes of one item closer than this are merged
  sensitivity: [0.07, 0.15]  # reported next to the main rule, never used to choose anything

behaviour:
  ramadan_window_days: 30    # "before Ramadan" = 1 to 30 days before its first day

# Forecast benchmark (notebooks 04a, 04b). A benchmark, not the product; every figure sits beside "tomorrow = today".
forecast:
  horizons: [1, 7, 14, 30]   # report days
  lags: [1, 7, 14, 30]       # log change over the last k reports
  rolling: [30]              # deviation from the 30-report mean, 30-report volatility
  rolling_min_periods: 10
  origin_step: 7             # one forecast origin every 7 report days
  refit_every: 8             # LightGBM is refitted every 8 origins
  rounds: 300
  grid:                      # chosen on 2024 only (04a); 2 x 2 x 2 x 2 = 16 configurations, simplest first
    feature_sets: [price_only, price_plus_drivers]
    num_leaves: [7, 31]
    learning_rate: [0.03, 0.05]
    objective: [l1, huber]
  tie_margin: 0.01           # a simpler configuration within 1 % of the best wins
  daily_h7: {start: "2023-06-01", refit_every: 30}   # 7-day forecasts from every report day, for the alert ranges (notebook 05)

# Filled from the output of 04a and committed BEFORE 04b scores 2025-26.
# Chosen 2026-11-17 by notebook 04a (local run on the work PC, code ae0b96c), 2024 origins only. Not to be changed after 04b runs.
forecast_choice:
  config: price_only|leaves7|lr0.03|l1
  feature_set: price_only
  params: {num_leaves: 7, learning_rate: 0.03, objective: l1}
  validation_rel_mae: 1.0472        # geometric mean over items and horizons of MAE / MAE of "tomorrow = today" (2024); above 1 = worse than naive

# Alert rules (notebooks 05a, 05b). Abnormal-rise detection, not early warning.
alerts:
  horizon: 7                 # the actual price is compared with the forecast made 7 report days earlier
  window: 120                # last known forecast errors per item for the range
  min_obs: 30
  persistence: {k: 3, m: 5}  # alert when above the bound on 3 of the last 5 report days
  levels: [0.9, 0.95, 0.975, 0.99]          # candidates for rule A (ML range) and rule B (simple range)
  thresholds: [0.03, 0.05, 0.07, 0.10]      # candidates for rule C (fixed 7-report rise)
  fa_target_per_item_year: 2.0              # most sensitive setting whose 2024 alert runs matching no rise stay <= this (user, 2026-11-17)
  match: {before_reports: 14, after_reports: 7}   # a run counts for an episode if it starts from 14 report days before onset to 7 after the end
  placebo_draws: 300

# Filled from the output of 05a and committed BEFORE 05b scores anything. Empty until then.
alert_choice: {}

files:
  data: processed/data_8.csv       # the one data table: prices and drivers, one row per item and report day
  rise_episodes: processed/rise_episodes_8.csv   # one row per sustained rise episode (dates and rise size, no prices)
  forecasts_test: processed/forecasts_test.csv   # 04b: weekly-origin test forecasts, naive / ETS / LightGBM (contains prices)
  forecasts_h7: processed/forecasts_h7.csv       # 04b: 7-day forecasts from every report day since 2023-06-01 (contains prices)
  checks: processed/checks.json
  figures: reports/figures
  manifest: raw/MANIFEST.csv
  tables: reports/tables
