alerts:
  chosen_level: 0.95
  source: state/prereg_S28.yaml (unchanged)
matching:
  after_reports: 7
  before_reports: 14
  unit: one alert run (first day of an uninterrupted alert) against one rise episode, one-to-one, same item
model_retrained: false
news_used: false
placebo:
  draws: 300
  method: alert-run dates of each item shifted by a random whole number of report days
  seed: 42
purpose: Fixed before alerts are scored against TCB price rises. Nothing below changes after seeing a result.
retrospective_note: 2025-26 was already scored by the earlier model, so results there are retrospective, not a first look
retrospective_period:
- '2025-01-01'
- '2026-10-24'
rise_rule:
  excluded: windows touching the sparse 2022 period; days without a reported price
  formula: R = P_t / P_(t-w) - 1 on reported prices of one item
  merge_gap_reports: 14
  persist_reports: 5
  threshold: 0.1
  window_reports: 14
sensitivity_thresholds:
- 0.07
- 0.15
sensitivity_use: reported only, never used to choose the rule
stage: S34
tuned_on_shock_episodes: false
validation_period:
- '2024-01-01'
- '2024-12-31'
